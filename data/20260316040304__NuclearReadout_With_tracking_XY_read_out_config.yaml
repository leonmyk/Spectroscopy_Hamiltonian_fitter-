version: 1

controllers:
  con1:
    type: opx1
    IP: 192.168.0.10
    port: 9510
    analog_inputs_offsets: [-0.01, -0.01]


integration_weights:
  integW_cos: [1.0, 0.0]
  integW_sin: [0.0, 1.0]
  integW_sin_minus: [0.0, -1.0]

elements:
  readout:
    controller:
      name: con1
      IQchannels: [1, 2]
      ADCchannels: [1, 2]
      time_of_flight: 376
      smearing: 0
      analog_outputs_offsets: [0.01522, 0.014]
      g: -0.041
      phi: -0.05

      digital_inputs_channel: 5
      digital_inputs_buffer: 0
      digital_inputs_delay: 104

    freq: 8.471e+9  # 8.4925e+9 
    IF: 50.e+6
    angle: -6.100630071114318  # for SMPD tune up
    I_threshold: 7.5e-05  # 0.05e-3 #-0.05e-3
    I_threshold_reset: -0.00025 #-0.05e-3

    pulses:
      readout:
        func: const
        amp: 0.03  # 0.096
        length: 1500
        integration_weights: [integW_cos, integW_sin, integW_sin_minus]
      readout_long:
        func: const
        amp: 0.05  # 0.096
        length: 800
        integration_weights: [integW_cos, integW_sin, integW_sin_minus]
      spectro:
        func: const
        amp: 0.03
        length: 50000
        integration_weights: [integW_cos, integW_sin, integW_sin_minus]


  flux_sticky:
    controller:
      name: con1
      IQchannels: 9 # Single input channel
      # analog_outputs_offsets:    [0] #[-0.1556]

      digital_inputs_channel: 9
      digital_inputs_buffer: 0
      digital_inputs_delay: 104

    freq: 0
    IF: 0
    sticky: true

    pulses:
      erf_pulse:
        func: erf_rising
        amp: 0.40
        length: 10000
        n_sigma: 6

  qubit:
    controller:
      name: con1
      IQchannels: 6 # Single input channel

      digital_inputs_channel: 4
      digital_inputs_buffer: 0
      digital_inputs_delay: 104

    freq: 6901587173.071945
    IF: -50.e+6

    pulses:
      pi_pulse:
        func: cos_pulse #gaussian_pulse
        amp: 0.2511
        length: 248
        n_sigma: 6
        mu: 0

      pi_square:
        func: const #gaussian_pulse
        amp: 0.07807434863240861
        length: 500
        n_sigma: 6
        mu: 0

  pump:
    controller:
      name: &pump_controller con1
      IQchannels: &pump_channels [7, 8]
      analog_outputs_offsets: &pump_offsets [0.0225, -0.043]
      g: &pump_g -0.02
      phi: &pump_phi -0.01


      digital_inputs_channel: &pump_di_channel 2
      digital_inputs_buffer: &pump_di_buffer 0
      digital_inputs_delay: &pump_di_delay 104

    freq: &pump_freq 7_634_469_000      #7_732_850_106          #7631.207e+6
    IF: &pump_IF 200.e+6

    pulses:
      erf_4Wmix:
        func: erf_pulse
        amp: &pump_erf_4Wmix_amp 0.14
        length: &pump_erf_4Wmix_length 15000
        sigma: 60
    pulse_length: *pump_erf_4Wmix_length
                                         # Added this because it's referenced in SMPD calibration but doesn't exist


  pump_sticky:
    controller:
      name: *pump_controller
      IQchannels: *pump_channels
      analog_outputs_offsets: *pump_offsets
      g: *pump_g
      phi: *pump_phi

      
      digital_inputs_channel: *pump_di_channel
      digital_inputs_buffer: *pump_di_buffer
      digital_inputs_delay: *pump_di_delay


    freq: *pump_freq
    IF: *pump_IF

    sticky: true

    pulses:
      erf_rising:
        func: erf_rising
        amp: *pump_erf_4Wmix_amp
        length: 360
        n_sigma: 6

  photon:
    controller:
      name: &photon_controller con1
      IQchannels: &photon_channels [3, 4]
      analog_outputs_offsets: &photon_offsets [0.0066, -0.0285]
      g: &photon_g 0.082
      phi: &photon_phi 0.12

      digital_inputs_channel: &photon_di_channel 3
      digital_inputs_buffer: &photon_di_buffer 0
      digital_inputs_delay: &photon_di_delay 104

    freq: &photon_freq 7_738_150_000 #7_739_500_000 # 7_739_850_894           # resonator frequency
    IF: &photon_IF 100_000_000



    pulses:
      const:
        func: const
        amp: &photon_pulse_amp 0.02 #0.015
        length: 15000
      erf_pulse:
        func: erf_pulse
        amp: *photon_pulse_amp
        length: *pump_erf_4Wmix_length
        sigma: 60


  photon_sticky:
    controller:
      name: *photon_controller
      IQchannels: *photon_channels
      analog_outputs_offsets: *photon_offsets
      g: *photon_g
      phi: *photon_phi

      digital_inputs_channel: *photon_di_channel
      digital_inputs_buffer: *photon_di_buffer
      digital_inputs_delay: *photon_di_delay

    freq: *photon_freq
    IF: *photon_IF

    sticky: true

    pulses:
      erf_pulse:
        func: erf_rising
        amp: *photon_pulse_amp
        length: 360
        n_sigma: 6

      erf_rising:
        func: erf_rising
        amp: *photon_pulse_amp
        length: 360
        n_sigma: 6

  photon_switch:
    controller:
      name: *photon_controller
      digital_inputs_channel: *photon_di_channel
      digital_inputs_buffer: 0
      digital_inputs_delay: 104

    switch: true

  photon_noise:
    controller:
      name: *photon_controller
      digital_inputs_channel: 7
      digital_inputs_buffer: 0
      digital_inputs_delay: 104

    switch: true

  spin:
    controller:
      name: *photon_controller
      IQchannels: *photon_channels
      analog_outputs_offsets: *photon_offsets
      g: *photon_g
      phi: *photon_phi

      digital_inputs_channel: &spin_di_channel 1
      digital_inputs_buffer: &spin_di_buffer 0
      digital_inputs_delay: &spin_di_delay 104

    freq: *photon_freq
    center_freq: -1600
    IF: *photon_IF

    pulses:
      pi_square_long:
        func: const
        amp: 0.00025
        length: 77_448

      pi_square_long_ish:
        func: const
        amp: 0.000334
        length: 52_208

      pi_square_long_old:
        func: const
        amp: 0.000167
        length: 104_416

      pi_square_short:
        func: const
        amp: 0.00334
        length: 6492

      pi_square_very_short:
        func: const
        amp: 0.0334
        length: 648

      pi_gauss_short: # for Manu Ramsey
        func: gaussian_pulse
        amp: 0.02
        length: 2724
        n_sigma: 6
        mu: 0

      pi_gauss_long: #rqbi freq is 9.73Khw
        func: gaussian_pulse
        amp: 0.001
        length: 51_408
        n_sigma: 6
        mu: 0

      pi_gauss_long_test:
        func: gaussian_pulse
        amp: 0.001
        length: 500
        n_sigma: 6
        mu: 0

      gaussian_pulse:
        func: gaussian_pulse
        amp: 0.19
        length: 1000
        n_sigma: 6
        mu: 0

      const:
        func: const
        amp: 0.01
        length: 2072

      # blue_sideband_rabi:  # parameters listed for 1st to nth sideband
      #   frequency:  [7_420_000, 6_732_000, 5_810_000, 5_000_000, 4_250_000, 0, 0, 0, 0]
      #   amplitude: [0.39, 0, 0, 0, 0, 0, 0, 0, 0]
      #   length: [0, 0, 0, 0, 0, 0, 0, 0, 0]

      # red_sideband_rabi:
      #   frequency:  [7_586_000, 6_862_000, 0, 0, 0, 0, 0, 0, 0]
      #   amplitude: [0, 0, 0, 0, 0, 0, 0, 0, 0]
      #   length: [0, 0, 0, 0, 0, 0, 0, 0, 0]


      # sideband: # 
      #   func: const
      #   amp: 0.14
      #   length: 10e6  # sideband pi-pulse

      sideband_pump:          # For pumping purposes only
        func: const
        amp: 0.02 # 0.1 # 0.07 # 0.05
        length: 10e+6 #0.018e+6

      sideband_pump_chirped:  # For pumping purposes only
        func: const
        amp: 0.14 #0.05
        length: 1e+6

      sideband_pump_chirped_bath:  # For pumping purposes only
        func: const
        amp: 0.02 #0.02 #0.0143 #0.05
        length: 10e+6

      erf_pulse:  # For pumping purposes only
        func: erf_pulse
        amp: 0.00005
        length: 15000
        sigma: 60

  spin_2:
    controller:
      name: *photon_controller
      IQchannels: *photon_channels
      analog_outputs_offsets: *photon_offsets
      g: *photon_g
      phi: *photon_phi

      digital_inputs_channel: *spin_di_channel
      digital_inputs_buffer: *spin_di_buffer
      digital_inputs_delay: *spin_di_delay

    freq: *photon_freq
    center_freq: 0
    IF: *photon_IF

    pulses:

      pi_gauss_long:
        func: gaussian_pulse
        amp: 0.0050860    #0.00281 #0.002 #0.0005 # 0.001 #0.002 #0.001 #0.002 # 0.001 #0.001 #0.0005 #0.002
        length: 15000 #28080 #135680 #68160 #34080 #68160 #34080 #53200 #76720 #153400 #38360
        n_sigma: 6
        mu: 0


  spin_sticky:
    controller:
      name: *photon_controller
      IQchannels: *photon_channels
      analog_outputs_offsets: *photon_offsets
      g: *photon_g
      phi: *photon_phi

      digital_inputs_channel: *spin_di_channel
      digital_inputs_buffer: *spin_di_buffer
      digital_inputs_delay: *spin_di_delay

    freq: *photon_freq
    IF: *photon_IF

    sticky: true

    pulses:
      erf_pulse:
        func: erf_rising
        amp: 0.001
        length: 360
        n_sigma: 6

      cos_rise:
        func: cos_rising
        amp: 0.19999 # Calibrated value is 0.2 but when applying two pulses it can overflow when constructively interfering to 0.4
        length: 360


  spin_sticky_2:
    controller:
      name: *photon_controller
      IQchannels: *photon_channels
      analog_outputs_offsets: *photon_offsets
      g: *photon_g
      phi: *photon_phi

      digital_inputs_channel: *spin_di_channel
      digital_inputs_buffer: *spin_di_buffer
      digital_inputs_delay: *spin_di_delay

    freq: *photon_freq
    IF: *photon_IF

    sticky: true

    pulses:
      cos_rise:
        func: cos_rising
        amp: 0.19999 # Calibrated value is 0.2 but when applying two pulses it can overflow when constructively interfering to 0.4
        length: 360

  spin_sticky_3:
    controller:
      name: *photon_controller
      IQchannels: *photon_channels
      analog_outputs_offsets: *photon_offsets
      g: *photon_g
      phi: *photon_phi

      digital_inputs_channel: *spin_di_channel
      digital_inputs_buffer: *spin_di_buffer
      digital_inputs_delay: *spin_di_delay

    freq: *photon_freq
    IF: *photon_IF

    sticky: true

    pulses:
      cos_rise:
        func: cos_rising
        amp: 0.19999 # Calibrated value is 0.2 but when applying two pulses it can overflow when constructively interfering to 0.4
        length: 360

  spin_sticky_4:
    controller:
      name: *photon_controller
      IQchannels: *photon_channels
      analog_outputs_offsets: *photon_offsets
      g: *photon_g
      phi: *photon_phi

      digital_inputs_channel: *spin_di_channel
      digital_inputs_buffer: *spin_di_buffer
      digital_inputs_delay: *spin_di_delay

    freq: *photon_freq
    IF: *photon_IF

    sticky: true

    pulses:
      cos_rise:
        func: cos_rising
        amp: 0.19999 # Calibrated value is 0.2 but when applying two pulses it can overflow when constructively interfering to 0.4
        length: 360


  aux_trigger:
    controller:
      name: con1
      digital_inputs_channel: 3
      digital_inputs_buffer: 0
      digital_inputs_delay: 104

    switch: true

  spin_trigger:
    controller:
      name: con1
      digital_inputs_channel: 1
      digital_inputs_buffer: 0
      digital_inputs_delay: 104

    switch: true



