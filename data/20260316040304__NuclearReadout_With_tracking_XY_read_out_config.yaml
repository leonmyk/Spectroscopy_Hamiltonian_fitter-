      pi_duration: [3000, 3200, 3300, 3400, 3500, 3600, 3700, 3800, 4000] # in ns for transitions 0-8
      pi_2_duration: [1500, 1600, 1650, 1700, 1750, 1800, 1850, 1900, 2000] # in ns for transitions 0-8

