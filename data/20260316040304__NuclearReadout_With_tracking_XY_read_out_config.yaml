circuit:
  qubit1:
    p_eq: 1.6e-3
    anharmonicity: 270.e+6
    T1: 100.e-6

  photon:
    Pin: &photon_Pin 5.185e+04 # ph/us
    n_average: 0.2349 # ph
    chi_qubit: -6.e+6
    kappa_tot: 0.141e+6
    aQM: -1101611     # Hz/V
    aYoko: -5889068 # Hz/V

  photon_sticky:
    Pin: *photon_Pin
  cavity:
    frequency: 0
    linewidth: 1_000_000



  SMPD:
    frequency: 0
    linewidth: 300_000
  smpd:
    qubit:
      element: qubit
      pi_pulse: pi_pulse
    readout:
      element: readout
      pulse: readout
    pump:
      element: pump
      pulse: erf_4Wmix
    flux:
      element: flux_sticky
      pulse: erf_pulse
  spin:
    element: spin
    pulse: pi_gauss_long
    ringdown_time: 25_000
    hyperfine_A: 35e+3
    hyperfine_A1: 38.5e+3
    hyperfine_A2: -11.881e+3

    # sideband_freq: 786.0e+3 # for driving
    # n_pumping: 10
    # pump_freq: 600.e+3 # for pumping
    # chirped_pump_freq: 500e3 #2.58097e6 #720.e+3 # for chirped pumping
    chirp_span: 300e3
    # chirpsideband_sign: -1

    frequency_offset: 0e+0  # center freq basically
    A_parallel: -35e3 # for calcium

    # niobium @ 3.0
    # blue_sideband_frequency: [ 7.424e6,  6.61e6,  5.793067e6,  4.990773e6,  4.173953e6,  3.355e6,  2.510e6, 1.412e6,  0.375e6] #0.505e6]  
